version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: centre-medical-db
    environment:
      POSTGRES_DB: centre_medical          # Correspond à votre DB_NAME
      POSTGRES_USER: postgres              # Correspond à votre DB_USER
      POSTGRES_PASSWORD: root              # Correspond à votre DB_PASSWORD
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  app:
    build: .                               # Build depuis le Dockerfile local
    # ou utilisez une image pré-construite :
    # image: mon-utilisateur/centre-medical:latest
    container_name: centre-medical-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Ces variables correspondent à votre application.properties externalisé
      DB_HOST: db                          # Nom du service dans docker-compose
      DB_PORT: 5432
      DB_NAME: centre_medical              # Même nom que dans application.properties
      DB_USER: postgres
      DB_PASSWORD: root
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    restart: always
    networks:
      - app-network

volumes:
  pgdata:
    driver: local

networks:
  app-network:
    driver: bridge